<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teto Trail - Login</title>
    <link rel="stylesheet" href="style2s.css">

</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="index.html">
                <img src="tETRA2.png" alt="Teto Trails Logo" >
            </a>
        </div>

        <div class="search-area">
            <input type="text" placeholder="What would you like to search for....." />
            <button class="search-btn">🔍</button>
        </div>

    <div class="nav-icons">
            <a href="Catalogue.html" title="Shopping Cart">🛒</a>
            <a href="Music.html" title="Headphones / Support">🎧</a>
            <span class="divider"></span>
            <a href="Login.html" class="text-sm font-medium hover:underline">Sign in</a>
        </div>
    </nav>

    <div class="Product">

        <main class="login-card">
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-subtitle">Sign in to continue your Teto Trail adventure.</p>

            <form id="loginForm">
                <input type="text" id="username" class="input-field" placeholder="Username or Email" required>
                <script src="https://cdn.tailwindcss.com"></script>
                <input type="password" id="password" class="input-field" placeholder="Password" required>

                <button type="submit" class="login-btn">
                    Log In
                </button>
            </form>

            <div class="card-footer-links">
                <a href="#" class="card-link">Forgot Password?</a>
                <span class="link-separator">|</span>
                <a href="#" class="card-link">Create Account</a>
            </div>
            
            <div id="messageBox" class="message-box"></div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const messageBox = document.getElementById('messageBox');

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Simple form validation
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                if (username === '' || password === '') {
                    // Using custom class .box-warning
                    showMessage('Please enter both username/email and password.', 'box-warning');
                    return;
                }

                // Simulate login process
                // Using custom class .box-info
                showMessage('Attempting to log in...', 'box-info');
                
                // Simulating API call delay (1.5 seconds)
                setTimeout(() => {
                    // Simple dummy credential check
                    if (username.toLowerCase() === 'teto' && password === 'baka') {
                        // Using custom class .box-success
                        showMessage(`Welcome, ${username}! Login successful.`, 'box-success');
                        loginForm.reset();
                    } else {
                        // Using custom class .box-error
                        showMessage('Login failed. Invalid credentials.', 'box-error');
                    }
                }, 1500);
            });
            
            function showMessage(message, classes) {
                messageBox.textContent = message;
                
                // Apply the base structural class and the dynamic status class
                messageBox.className = `message-box ${classes}`;
                
                // Show the box (overrides the display: none in the .message-box CSS)
                messageBox.style.display = 'block';
                
                // Clear message after 4 seconds unless it's a permanent error message
                if (!message.includes('failed')) {
                    setTimeout(() => {
                        messageBox.style.display = 'none';
                    }, 4000);
                }
            }

            console.log('Login menu loaded.');
        });
    </script>
</body>

</html>
